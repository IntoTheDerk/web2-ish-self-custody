name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: w2sc_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: w2sc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U w2sc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      W2SC_TEST_DATABASE_URL: postgresql://w2sc_test:local-ci-only@localhost:5432/w2sc_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r scripts/requirements-vector-verifier-ci.txt
      - run: npm ci
      - run: npm run verify

  attribution:
    name: no AI attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit messages and PR description
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='(co-authored-by:.*(claude|anthropic|openai|codex|chatgpt|copilot|gemini|cursor))|generated with \[?(claude|codex|chatgpt|copilot|cursor)'
          fail=0
          if git log --format='%H%n%B' "$BASE..$HEAD" | grep -Eiq "$pattern"; then
            echo "::error::A commit message contains an AI co-author or 'Generated with' line. Reword the commit(s) to remove it."
            git log --format='%h %s' "$BASE..$HEAD"
            fail=1
          fi
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eiq "$pattern"; then
            echo "::error::The PR title or description contains an AI attribution line. Edit the PR to remove it."
            fail=1
          fi
          exit $fail
